<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 -apple-system, system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    button { display: block; width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #d2d2d7;
             border-radius: 8px; background: #f5f5f7; cursor: pointer; font-size: 13px; }
    button.primary { background: #0071e3; color: #fff; border-color: #0071e3; }
    #status { margin-top: 8px; color: #555; min-height: 16px; }
    a { color: #0071e3; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Apple IN Autofill</h1>
  <button id="open" class="primary">Open buy page (SKU)</button>
  <button id="reset">Reset &amp; open fresh (Alt+Shift+R)</button>
  <button id="fill">Autofill this page (Alt+Shift+F)</button>
  <div id="status"></div>
  <a href="#" id="opts">Edit config &amp; selectors</a>
  <script src="popup.js"></script>
</body>
</html>
