name: Discount & Offers Monitor

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-discount:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Restore alert state cache
        uses: actions/cache@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-
      
      - name: Check Flipkart discount
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
        run: |
          python check_discount.py
      
      - name: Check NoOnes P2P offers
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
        run: |
          python check_noones.py
      
      - name: Check Amazon Gift Card price
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
        run: |
          python check_amazon.py
      
      - name: Check Apple iPhone 16 same-day pickup (Saket + Noida / 110017)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
          APPLE_PINCODE: "110017"
          APPLE_STORE_IDS: "R756,R787"
          # Default: same-day (daily) pickup only. For a fixed date, set e.g. APPLE_PICKUP_DATES: "20260331".
          # Optional: Cookie header from browser (after PIN + pickup at Saket or Noida).
          APPLE_COOKIES: ${{ secrets.APPLE_COOKIES }}
          APPLE_SAME_DAY_ONLY: "true"
          APPLE_REQUIRE_SAKET: "true"
        run: |
          python check_apple_iphone16.py
      
      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            .alert_state/
          retention-days: 7
