name: Discount & Offers Monitor

on:
  # Triggered externally by cron-job.org every 5 minutes via workflow_dispatch
  # (GitHub Actions scheduler is unreliable at sub-10-minute intervals)
  workflow_dispatch:

# Serialize runs so a slow/queued run doesn't let the next 5-min dispatch stack
# on top of it. Prevents pile-ups (and the startup_failure clusters they cause)
# when GitHub's hosted-runner allocation is congested. Never cancel a run in
# progress -- each run does real scraping work we don't want to abort midway.
concurrency:
  group: discount-monitor
  cancel-in-progress: false

jobs:
  check-discount:
    runs-on: ubuntu-latest

    # Bright Data Scraping Browser endpoints, set once for the whole job so every monitor
    # that needs them inherits the pool. Adding another endpoint later is a one-line change
    # here (plus the matching GitHub secret) -- no per-step edits. Only the monitors that
    # import brightdata_browser use them; the rest harmlessly ignore these vars.
    env:
      BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
      BRIGHTDATA_BROWSER_WSS_2: ${{ secrets.BRIGHTDATA_BROWSER_WSS_2 }}
      BRIGHTDATA_BROWSER_WSS_3: ${{ secrets.BRIGHTDATA_BROWSER_WSS_3 }}
      BRIGHTDATA_BROWSER_WSS_4: ${{ secrets.BRIGHTDATA_BROWSER_WSS_4 }}
      BRIGHTDATA_BROWSER_WSS_5: ${{ secrets.BRIGHTDATA_BROWSER_WSS_5 }}
      BRIGHTDATA_BROWSER_WSS_6: ${{ secrets.BRIGHTDATA_BROWSER_WSS_6 }}
      BRIGHTDATA_BROWSER_WSS_7: ${{ secrets.BRIGHTDATA_BROWSER_WSS_7 }}
      BRIGHTDATA_BROWSER_WSS_8: ${{ secrets.BRIGHTDATA_BROWSER_WSS_8 }}
      BRIGHTDATA_BROWSER_WSS_9: ${{ secrets.BRIGHTDATA_BROWSER_WSS_9 }}
      BRIGHTDATA_BROWSER_WSS_10: ${{ secrets.BRIGHTDATA_BROWSER_WSS_10 }}
      BRIGHTDATA_BROWSER_WSS_11: ${{ secrets.BRIGHTDATA_BROWSER_WSS_11 }}
      # Scrapfly keys (BigBasket -> beats Akamai via asp). Cycled like the BD pool: each
      # free account is ~1,000 credits/mo; scrapfly_reader auto-discovers SCRAPFLY_KEY[_N]
      # and rotates them. Unset secrets are empty and ignored. Add more slots as you create
      # accounts. ~25 credits/call, so the BigBasket step throttles hard (see below).
      SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
      SCRAPFLY_KEY_2: ${{ secrets.SCRAPFLY_KEY_2 }}
      SCRAPFLY_KEY_3: ${{ secrets.SCRAPFLY_KEY_3 }}
      SCRAPFLY_KEY_4: ${{ secrets.SCRAPFLY_KEY_4 }}
      SCRAPFLY_KEY_5: ${{ secrets.SCRAPFLY_KEY_5 }}
      SCRAPFLY_KEY_6: ${{ secrets.SCRAPFLY_KEY_6 }}
      SCRAPFLY_KEY_7: ${{ secrets.SCRAPFLY_KEY_7 }}
      SCRAPFLY_KEY_8: ${{ secrets.SCRAPFLY_KEY_8 }}
      SCRAPFLY_KEY_9: ${{ secrets.SCRAPFLY_KEY_9 }}
      SCRAPFLY_KEY_10: ${{ secrets.SCRAPFLY_KEY_10 }}
      SCRAPFLY_KEY_11: ${{ secrets.SCRAPFLY_KEY_11 }}
      SCRAPFLY_KEY_12: ${{ secrets.SCRAPFLY_KEY_12 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        continue-on-error: true

      - name: Restore alert state cache
        uses: actions/cache@v4
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-
        continue-on-error: true

      - name: Check Flipkart discount
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
        run: |
          python check_discount.py
        continue-on-error: true

      - name: Check BitValve P2P offers
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "12"
        run: |
          python check_bitvalve.py
        continue-on-error: true

      - name: Check Amazon Pay gift card upfront discount (dynamic discovery)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Amazon physical gift card: 24h cool-off. Once a discount is found it also skips
          # scanning entirely for 24h (AMAZON_FOUND_COOLDOWN_HOURS) -- no repeat alerts, no
          # Bright Data credits spent re-checking the same live deal.
          ALERT_COOLDOWN_HOURS: "6"
          AMAZON_FOUND_COOLDOWN_HOURS: "6"
          AMAZON_MIN_DISCOUNT: "2.0"
          # Amazon CAPTCHAs the datacenter IP, so on CI this runs through the Scraping
          # Browser (residential): it discovers the current gift-card ASINs from the deals
          # listing (festival ASINs rotate, so a static seed list goes stale), then verifies
          # each via its product page.
          AMAZON_GC_MAX: "8"
          # Fetch Amazon for FREE via Jina Reader (r.jina.ai) instead of Bright Data: Jina
          # fetches from its own IPs, so no residential proxy / credits. Amazon-only switch --
          # brightdata_browser routes only amazon.in origins to Jina; Blinkit/Zepto stay on
          # Bright Data. Run KEYLESS: keyless is rate-limited (~20 req/min) but NOT token-
          # metered, so it never runs out. A free JINA_API_KEY is faster (500 rpm) but its
          # small token grant is burned by full-HTML pages within hours -> then 402; not worth
          # it here. MAX/concurrency kept modest to stay under the keyless rate limit;
          # jina_reader retries on 429 and falls back to keyless on 402.
          AMAZON_USE_JINA: "1"
          JINA_CONCURRENCY: "2"
          # Free via Jina -> scan every dispatch (~5 min). A 10-min throttle + 5-min dispatch
          # + run jitter actually yielded a ~15-min cadence, so a deal landing just after a scan
          # waited ~15 min (e.g. a 2% Amazon Pay card seen ~15 min late). Discovery still every 4h.
          AMAZON_RUN_INTERVAL_MIN: "0"
          AMAZON_DISCOVERY_INTERVAL_MIN: "240"
          # Jina only -- never fall back to Bright Data for Amazon, so frequent scans can't
          # burn BD credits (a Jina-CAPTCHA'd call is just retried next scan).
          AMAZON_JINA_BD_FALLBACK: "0"
        run: |
          python check_amazon.py
        continue-on-error: true

      - name: Check Amazon iPhone 15 base-handset stock
        if: false  # temporarily disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 24h cooldown, keyed per-ASIN (see check_amazon_iphone.py) so each handset alerts
          # at most once/day and one model's alert never silences the others.
          AMAZON_IPHONE_COOLDOWN_HOURS: "24"
          # iPhone 16 and 17 disabled per user request -- only 15 base handset stays active.
          AMAZON_IPHONE_MODELS: "15"
          # iPhone 18 Pro monitoring is temporarily disabled.
          AMAZON_IPHONE_PRO_MODELS: ""
          AMAZON_IPHONE_STORAGE: ""
          # Delivery pincode: Prime badge + delivery promise are location-specific. Only alert
          # when Amazon commits a delivery promise here (real stock), not a ghost "Only N left".
          AMAZON_IPHONE_PINCODE: "560035"
          # Amazon CAPTCHAs the datacenter IP, so on CI this runs through the Scraping
          # Browser (residential): it discovers base-handset ASINs from the search listing
          # (unioned with the always-checked seed ASINs, since the search is high-variance
          # and often outranks the base models), then reads each product page's availability.
          AMAZON_IPHONE_MAX: "8"
          # Fetch Amazon for FREE via Jina Reader (see the gift-card step above). Amazon-only.
          # NOTE: stock detection AND the Prime gate both WORK through Jina -- verified an
          # in-stock Amazon-fulfilled item parses in_stock=True, deliverable=True (real
          # DELIVERY_BLOCK promise slot), ships_from=Amazon -> _prime_ok=True -> it alerts.
          # Jina resolves a DEFAULT India location, so the delivery promise is for that, not
          # 560035 specifically; a location-restricted offer could occasionally mismatch, but
          # nationally-available base handsets are fine. Switch this step back to Bright Data
          # only if you need strict 560035 accuracy.
          AMAZON_USE_JINA: "1"
          JINA_CONCURRENCY: "2"
          # Free via Jina -> scan every dispatch (~5 min). A 10-min throttle + 5-min dispatch
          # + jitter gave a ~15-min cadence, delaying detection (matters for the iPhone 18 Pro
          # launch). Discovery still only every 4h.
          AMAZON_IPHONE_RUN_INTERVAL_MIN: "0"
          AMAZON_IPHONE_DISCOVERY_INTERVAL_MIN: "240"
          # Jina only -- never fall back to Bright Data for Amazon, so frequent scans can't
          # burn BD credits (a Jina-CAPTCHA'd call is just retried next scan).
          AMAZON_JINA_BD_FALLBACK: "0"
        run: |
          python check_amazon_iphone.py
        continue-on-error: true

      - name: Check Apple iPhone 16 same-day pickup (Saket + Noida / 110017)
        if: false  # disabled — replaced by iPhone 17 monitor below
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPLE_PINCODE: "110017"
          APPLE_STORE_IDS: "R756,R787"
          APPLE_COOLDOWN_HOURS: "0.083"
          APPLE_SAME_DAY_ONLY: "true"
          APPLE_REQUIRE_SAKET: "true"
        run: |
          python check_apple_iphone16.py
        continue-on-error: true

      - name: Check Apple iPhone 17 same-day pickup (Saket + Noida / 110017)
        if: false  # disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPLE_PINCODE: "110017"
          APPLE_STORE_IDS: "R756,R787"
          # 15 min between alerts so a re-stock re-notifies quickly (0.25h)
          APPLE_COOLDOWN_HOURS: "0.25"
          APPLE_SAME_DAY_ONLY: "true"
          APPLE_REQUIRE_SAKET: "true"
          # Pickup stock at Saket/Noida trickles in and vanishes in minutes; the workflow
          # only fires every 5 min. This (free, direct) API is cheap, so poll it in a tight
          # loop for 3 min per run -> detection latency drops from ~5 min to ~1 min. Kept
          # under the 5-min dispatch (other steps ~90s) so runs don't pile up.
          APPLE_POLL_SECONDS: "180"
          APPLE_POLL_INTERVAL: "45"
        run: |
          python check_apple_iphone17.py
        continue-on-error: true

      - name: Check Apple iPhone 18 Pro/Pro Max Burgundy same-day pickup (Saket + Noida / 110017)
        if: false  # temporarily disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPLE_PINCODE: "110017"
          APPLE_STORE_IDS: "R756,R787"
          # 2 min between alerts so a re-stock re-notifies quickly
          APPLE_COOLDOWN_HOURS: "0.0333"
          APPLE_SAME_DAY_ONLY: "true"
          APPLE_REQUIRE_SAKET: "true"
          # Same tight in-run poll loop as the iPhone 17 step: launch pickup stock at
          # Saket/Noida appears and vanishes in minutes, so poll for 3 min per run.
          APPLE_POLL_SECONDS: "180"
          APPLE_POLL_INTERVAL: "45"
        run: |
          python check_apple_iphone18pro.py
        continue-on-error: true

      - name: Check Vijay Sales iPhone 17 (256GB, all colours) stock + non-EMI card offer
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VIJAYSALES_STOCK_COOLDOWN_HOURS: "12"
          VIJAYSALES_NONEMI_COOLDOWN_HOURS: "24"
          # 3 target areas + geographic neighbours (Bangalore / Ghaziabad-Noida / Salem)
          VIJAYSALES_PINCODES: "560035,560103,560048,560087,201019,201301,201009,110096,636007,636006,636004,636009"
        run: |
          python check_vijaysales_iphone17.py
        continue-on-error: true

      - name: Check Shopsy Flipkart Physical Gift Card stock (Rs.1000)
        if: false  # disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "24"
        run: |
          python check_shopsy_giftcard.py
        continue-on-error: true

      - name: Check MagicPin PhonePe Rs.10000 voucher stock
        if: false  # disabled per user request
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "1"
        run: |
          python check_magicpin_phonepe.py
        continue-on-error: true

      - name: Check OnePlay PhonePe Gift Card Rs.7500 stock
        if: false  # disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "24"
        run: |
          python check_oneplay_phonepe.py
        continue-on-error: true

      - name: Check MagicPin Amazon Pay Rs.5000/10000 in stock with discount
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "1"
          MAGICPIN_AMAZON_MIN_DISCOUNT: "2.0"
        run: |
          python check_magicpin_amazon.py
        continue-on-error: true

      - name: Check Blinkit Amazon Pay Physical Gift Card stock (560035)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "24"
          BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
          BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
          BLINKIT_AMAZON_MIN_DENOMINATION: "5000"  # only big cards (>=Rs.5000)
          # Blinkit 403s the datacenter IP -> route through the Scraping Browser,
          # throttled to once/120 min to conserve credits.
          BLINKIT_AMAZON_RUN_INTERVAL_MIN: "120"
        run: |
          python check_blinkit_amazon.py
        continue-on-error: true

      - name: Check Reliance Digital iPhone 16/17 stock (560035)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RELIANCE_PINCODE: "560035"
          RELIANCE_MODELS: "16,17"
          RELIANCE_EXCLUDED_COLORS: "teal"
          RELIANCE_COOLDOWN_HOURS: "0.0333"  # 2 minutes
        run: |
          python check_reliancedigital_iphone.py
        continue-on-error: true

      - name: Check Blinkit iPhone 15/16/17 stock (560035)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BLINKIT_MODELS: "15,16,17"
          BLINKIT_IPHONE_COOLDOWN_HOURS: "12"
          BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
          BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
          # Bright Data Scraping Browser (CDP/wss endpoint) -- required: Blinkit's iPhone
          # search returns 403 to datacenter IPs and to bare API clients, but 200 from a
          # real browser session. When unset, the script falls back to a direct request.
          # Optional additional Scraping Browser endpoints -- rotated per run to spread
          # credit/rate load (and multiply the free budget if they're separate accounts).
          # Only actually hit the browser at most once per this many minutes (the workflow
          # fires every 5 min); throttled to conserve the limited Scraping Browser credits.
          # 120 = every 2h (safe on a single 5,000-credit account). Lower to 60 if you have
          # two separate Bright Data accounts (the two WSS secrets ~= 10,000 credits).
          BLINKIT_RUN_INTERVAL_MIN: "120"
        run: |
          python check_blinkit_iphone.py
        continue-on-error: true

      - name: Check BigBasket iPhone 15/16/17 stock (560035)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BIGBASKET_MODELS: "15,16,17"
          BIGBASKET_COOLDOWN_HOURS: "0.0333"  # 2 minutes
          BIGBASKET_LAT: ${{ secrets.BIGBASKET_LAT }}
          BIGBASKET_LON: ${{ secrets.BIGBASKET_LON }}
          # BigBasket is Akamai-gated -> routes through Scrapfly (asp), ~25 credits/call
          # (+ a retry when listing-svc throws its transient PL5012 404). With 4 free keys
          # (~4,000 credits/mo) that budgets to a scrape every ~8h. Raise/lower as you add
          # keys; scrapfly_reader cycles all SCRAPFLY_KEY[_N] secrets.
          BIGBASKET_RUN_INTERVAL_MIN: "480"
        run: |
          python check_bigbasket_iphone.py
        continue-on-error: true

      - name: Check Croma iPhone 15/16/17 stock (560035, 560048)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CROMA_PINCODE: "560035,560048"
          CROMA_MODELS: "16,17"
          CROMA_EXCLUDED_COLORS: "teal"
          # Empty = no discount gate; every watched model (15/16/17) alerts on stock alone.
          CROMA_DISCOUNT_MODELS: ""
          # Current Croma iPhone 17 new-price SKUs are monitored, but should only alert
          # when Croma has a real discount instead of stock-only availability.
          CROMA_DISCOUNT_SKUS: "324530,324462,324465,324468"
          CROMA_COOLDOWN_HOURS: "0.0333"  # 2 minutes
        run: |
          python check_croma_iphone.py
        continue-on-error: true

      - name: Check SmartBuy iPhone 17 stock (256GB, all colours) -- add-to-cart probe, browserless
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # iPhone 17, 256GB, every colour. Stock is probed by replaying the site's own
          # add-to-cart XHR (self-generated form_key + PHPSESSID); a variant counts as in
          # stock only if it carts AND isn't flagged out-of-stock on the cart page.
          SMARTBUY_STORAGES: "256GB"
          SMARTBUY_COLORS: "Black,White,Sage,Lavender,Mist Blue"
          # Once an alert fires, hold off 6h before re-notifying the same variant.
          SMARTBUY_COOLDOWN_HOURS: "6"
        run: |
          python check_smartbuy_iphone.py
        continue-on-error: true

      - name: Check Flipkart iPhone stock (15 128GB, 17 256GB) per pincode -- rome API, browserless
        if: false  # disabled per user request
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # iPhone 15 (128 GB only) + iPhone 17 (256 GB only).
          FLIPKART_MODELS: "15,17"
          FLIPKART_PRO_MODELS: ""
          FLIPKART_STORAGE: "15:128,17:256"
          # Alert only when BUYABLE (serviceable + available) at ANY of these; the alert names which.
          # Per-pincode serviceability comes from Flipkart's internal rome API (flipkart_rome.py):
          # POST /api/4/location/update to bind the pincode, then /api/4/page/fetch. No browser.
          # NOTE: rome reflects the ANONYMOUS view -- a listing can read buyable here yet fail at the
          # logged-in Buy Now step ("not available"); that appears account/checkout-specific.
          FLIPKART_PINCODES: "201019,560035"
          FLIPKART_MAX: "12"
          # A few JSON calls per pincode, so run every dispatch (~5 min).
          FLIPKART_RUN_INTERVAL_MIN: "0"
          # Per-variant cooldown. 2h re-notifies a real restock without spamming on the known
          # anonymous-view false positive.
          FLIPKART_IPHONE_COOLDOWN_HOURS: "2"
          # Optional residential proxy if the runner's datacenter IP gets PerimeterX-gated:
          # FLIPKART_PROXY: ${{ secrets.FLIPKART_PROXY }}
        run: |
          python check_flipkart_iphone.py
        continue-on-error: true

      - name: Check JioMart iPhone discount (15/16/17 — non-EMI bank offer or base discount)
        if: false  # temporarily disabled
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JIOMART_IPHONE_COOLDOWN_HOURS: "1"
          JIOMART_MIN_DISCOUNT: "2000"
          JIOMART_PINCODES: "560035"
          # Set JIOMART_LAT/JIOMART_LON secrets to your exact home coords so the
          # monitor checks your specific QC zone, not the pincode centroid.
          JIOMART_LAT: ${{ secrets.JIOMART_LAT }}
          JIOMART_LON: ${{ secrets.JIOMART_LON }}
        run: |
          python check_jiomart_iphone.py
        continue-on-error: true

      - name: Check Zepto Amazon Pay Gift Card discount (560035)
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "24"
          ZEPTO_MIN_DISCOUNT: "1.0"
          # No denomination floor for Zepto: the higher denominations (>=Rs.5000) are hidden
          # from the anonymous Bright Data session by Zepto's anti-bot gating, so alert on ANY
          # discounted Amazon Pay card. (Per-card cooldown still prevents repeat spam.)
          ZEPTO_MIN_DENOMINATION: "0"
          # Zepto's BFF sits behind an AWS-WAF JS challenge that blocks bare API clients
          # -> route through the Bright Data Scraping Browser (real Chrome, residential IP).
          ZEPTO_RUN_INTERVAL_MIN: "120"
        run: |
          python check_zepto_amazon.py
        continue-on-error: true

      - name: Check JioMart iPhone 16 Pro Max 256GB stock (560035)
        if: false  # temporarily disabled
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_COOLDOWN_HOURS: "4"
          JIOMART_PINCODES: "560035,560048,560103"
        run: |
          python check_jiomart_iphone16promax.py
        continue-on-error: true
